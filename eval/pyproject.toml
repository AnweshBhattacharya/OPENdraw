[project]
name = "clippy"
version = "0.1.0"
description = "Frozen, non-learned comparator baseline used as the Milestone 4 evaluation floor."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "linescout-ml",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.scripts]
clippy = "clippy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
linescout-ml = { path = "../ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clippy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
